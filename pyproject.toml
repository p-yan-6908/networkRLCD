[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "calibrated-media-rl"
version = "0.1.0"
description = "Reproducible calibrated RL experiments for real-time media adaptation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]
rtc-peers = ["onnxruntime==1.23.2"]

[project.scripts]
media-rl = "media_rl.cli:main"
jevbwe-rlcd = "media_rl.jevbwe_rlcd_cli:main"
jevbwe-typed = "media_rl.typed_bitrate_experiment:main"
media-actuator = "media_rl.native_actuator_study:main"
media-actuator-panel = "media_rl.native_actuator_panel:main"
media-actuator-qualification = "media_rl.native_actuator_qualification_panel:main"
media-panel-assets = "media_rl.native_panel_assets:main"
media-acquisition-audit = "media_rl.native_acquisition_audit:main"
media-acquisition-discovery = "media_rl.native_acquisition_discovery:main"

[tool.hatch.build.targets.wheel]
packages = ["src/media_rl"]

[tool.hatch.build.targets.wheel.force-include]
"benchmarks/native_rtc" = "media_rl/native_assets"

[tool.hatch.build.targets.sdist]
include = [
  "src/**", "tests/**", "benchmarks/native_rtc/**", "benchmarks/jevbwe/*.py", "configs/*.json", "docs/*.md", "paper/*.tex", "paper/*.md",
  "research/*.md", "research/*.bib", "README.md", "GOAL.md", "uv.lock",
  ".python-version", "pyproject.toml", "Makefile", ".github/workflows/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
